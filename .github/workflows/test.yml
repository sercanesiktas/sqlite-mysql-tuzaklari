name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: kok
          MARIADB_DATABASE: tuzak
          MARIADB_USER: tuzak
          MARIADB_PASSWORD: tuzak
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_mysql
      - run: php tests/run.php
        env:
          TUZAK_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=tuzak;charset=utf8mb4
